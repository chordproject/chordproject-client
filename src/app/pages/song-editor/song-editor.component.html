<div class="bg-card flex h-full min-h-0 flex-col overflow-auto p-6 sm:p-8">
    <div class="mx-auto w-full max-w-6xl">
        <header class="mb-6 flex flex-col gap-2">
            <p class="text-sm font-semibold uppercase tracking-[0.16em] text-primary-600 dark:text-primary-400">
                {{ 'studio_page.eyebrow' | transloco }}
            </p>
            <h1 class="text-3xl font-bold text-neutral-900 dark:text-neutral-100">
                {{ 'studio_page.title' | transloco }}
            </h1>
            <p class="max-w-3xl text-sm text-neutral-600 dark:text-neutral-300">
                {{ 'studio_page.description' | transloco }}
            </p>
            <p class="max-w-3xl text-sm text-neutral-500 dark:text-neutral-400">
                {{ 'studio_page.secondary' | transloco }}
            </p>
        </header>

        <chp-split-layout class="h-full w-full flex-auto" [leftTemplate]="editor" [rightTemplate]="viewer"> </chp-split-layout>
    </div>
</div>

<ng-template #editor>
    <mat-card class="flex h-full flex-col">
        @if (!isAuthenticated()) {
            <div class="border-b border-amber-200 bg-amber-50 px-4 py-2 text-sm text-amber-900 dark:border-amber-800 dark:bg-amber-950/40 dark:text-amber-200">
                {{ 'editor.guest_editing_notice' | transloco }}
            </div>
        }
        <chp-editor
            [content]="song().content"
            [songKey]="song().songKey"
            (contentChange)="onContentChange($event)"
            [showDelete]="canDelete()"
            tabindex="0"
            (close)="onEditorClose()"
            (save)="saveSong()"
            (remove)="removeSong()"
            (preview)="openPreview()"
            (transpose)="transposeSong($event)"
            (help)="showHelp()"
        ></chp-editor>
    </mat-card>
</ng-template>

<ng-template #viewer>
    <chp-song-preview
        #songPreview
        [song]="song()"
        [pendingSuggestion]="hasPendingSuggestion()"
        [showToolbar]="false"
        [showClose]="true"
        [closeOnlyOnMobile]="true"
        (close)="closePreview()"
    ></chp-song-preview>
</ng-template>
