<chp-split-layout class="h-full w-full flex-auto" [leftTemplate]="editor" [rightTemplate]="viewer"> </chp-split-layout>

<ng-template #editor>
    <mat-card class="flex h-full flex-col">
        @if (!isAuthenticated()) {
            <div class="border-b border-amber-200 bg-amber-50 px-4 py-2 text-sm text-amber-900 dark:border-amber-800 dark:bg-amber-950/40 dark:text-amber-200">
                {{ 'editor.guest_editing_notice' | transloco }}
            </div>
        }
        <chp-editor
            [(content)]="song.content"
            tabindex="0"
            (close)="onEditorClose()"
            (save)="saveSong()"
            (remove)="removeSong()"
            (help)="showHelp()"
        ></chp-editor>
    </mat-card>
</ng-template>

<ng-template #viewer>
    <chp-song-preview
        [song]="song"
        [pendingSuggestion]="hasPendingSuggestion()"
        [alternateVersions]="alternateVersions()"
        [alternateVersionRoute]="'editor'"
    ></chp-song-preview>
</ng-template>
