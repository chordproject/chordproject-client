<chp-split-layout
    class="absolute inset-0 flex min-w-0 flex-col overflow-hidden"
    [leftTemplate]="songList"
    [rightTemplate]="viewer"
    [hasSecondaryContent]="!!selectedSong"
>
</chp-split-layout>

<ng-template #songList>
    <songs-list
        [selectedSong]="selectedSong"
        (songSelect)="selectSong($event)"
        (songDblClick)="onDblClick($event)"
        (selectionCleared)="closePreview()"
    ></songs-list>
</ng-template>

<ng-template #viewer>
    @if (selectedSong; as song) {
        <chp-song-preview
            [song]="song"
            [showFullEditor]="true"
            [showClose]="true"
            (openFullEditor)="openFullEditor()"
            (close)="closePreview()"
        ></chp-song-preview>
    }
</ng-template>
