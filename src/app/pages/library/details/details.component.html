<div class="bg-card flex w-full flex-col">
    <!-- View mode -->
    @if (!editMode) {
        <!-- Header -->
        <div
            class="relative w-full border-b border-neutral-200 bg-neutral-100 px-8 pr-4 sm:pl-12 dark:border-neutral-700 dark:bg-neutral-800"
        >
            <!-- Header flex row: title + action left, close right -->
            <div class="mx-auto flex w-full max-w-3xl items-center justify-between pb-3 pt-3">
                <!-- Left: Title -->
                <div class="min-w-0 max-w-xs truncate text-4xl font-bold sm:max-w-md md:max-w-lg">
                    {{ song.title }}
                </div>
                <!-- Right: Edit and Close buttons -->
                <div class="flex items-center gap-2">
                    <button
                        mat-icon-button
                        class="flex-shrink-0"
                        (click)="toggleEditMode(true)"
                        [matTooltip]="'Quick edit'"
                    >
                        <mat-icon class="size-5" [svgIcon]="'square-pen'"></mat-icon>
                    </button>
                    <button
                        mat-icon-button
                        [matTooltip]="'Open in full reader'"
                        [routerLink]="['/songs/read', song.uid]"
                    >
                        <mat-icon [svgIcon]="'external-link'"></mat-icon>
                    </button>
                    <button mat-icon-button class="flex-shrink-0" [matTooltip]="'Close'" [routerLink]="['../']">
                        <mat-icon [svgIcon]="'x'"></mat-icon>
                    </button>
                </div>
            </div>

        </div>

        <!-- Song -->
        <div class="relative flex flex-auto flex-col items-center bg-white p-6 pt-0 sm:p-12 sm:pt-0 dark:bg-transparent">
            <div class="w-full max-w-3xl">
                <chp-viewer #viewer [content]="song.content"> </chp-viewer>
            </div>
        </div>
    }

    <!-- Edit mode -->
    @if (editMode) {
        <chp-editor
            [mode]="'quick'"
            [(content)]="songContent"
            tabindex="0"
            (close)="toggleEditMode(false)"
            (save)="updateSong()"
            (remove)="deleteSong()"
            (openFullEditor)="openFullEditor()"
        ></chp-editor>
    }
</div>
