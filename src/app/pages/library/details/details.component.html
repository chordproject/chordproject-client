<div class="bg-card flex w-full flex-col">
    <!-- View mode -->
    @if (!editMode) {
        <chp-song-preview
            [song]="song"
            [showQuickEdit]="true"
            [showFullEditor]="true"
            [showClose]="true"
            (quickEdit)="toggleEditMode(true)"
            (openFullEditor)="openFullEditor()"
            (close)="closePreview()"
        ></chp-song-preview>
    }

    <!-- Edit mode -->
    @if (editMode) {
        <chp-editor
            [mode]="'quick'"
            [(content)]="songContent"
            tabindex="0"
            (close)="toggleEditMode(false)"
            (save)="updateSong()"
            (remove)="deleteSong()"
            (openFullEditor)="openFullEditor()"
        ></chp-editor>
    }
</div>
