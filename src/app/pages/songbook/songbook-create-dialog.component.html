<div class="flex w-full flex-col sm:min-w-100">
    <header class="border-b border-neutral-200 px-6 py-4 dark:border-neutral-800">
        <h2 class="text-xl font-semibold">{{ 'songbook_create.title' | transloco }}</h2>
        <p class="text-secondary mt-1 text-sm">{{ 'songbook_create.description' | transloco }}</p>
    </header>

    <form class="flex flex-col gap-4 p-6" [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field class="w-full" subscriptSizing="dynamic">
            <mat-label>{{ 'songbook_create.name_label' | transloco }}</mat-label>
            <input matInput formControlName="name" />
            @if (form.controls.name.hasError('required') || form.controls.name.hasError('minlength')) {
                <mat-error>{{ 'songbook_create.name_error' | transloco }}</mat-error>
            }
        </mat-form-field>

        <footer class="flex justify-end gap-3 pt-2">
            <button matButton="outlined" type="button" [matDialogClose]="undefined">
                {{ 'confirmation.cancel' | transloco }}
            </button>
            <button matButton="filled" type="submit">
                {{ 'songbook_create.submit' | transloco }}
            </button>
        </footer>
    </form>
</div>
