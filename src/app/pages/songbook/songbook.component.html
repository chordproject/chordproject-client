<chp-split-layout class="h-full w-full flex-auto" [leftTemplate]="songList" [rightTemplate]="viewer">
</chp-split-layout>

<ng-template #songList>
    @if (songbook$ | async; as songbook) {
        <div class="flex h-full flex-col dark:border-[#334155]">
            <!-- Sección superior -->
            <div
                class="relative w-full border-b border-neutral-200 bg-neutral-100 px-8 pr-4 sm:pl-12 dark:border-neutral-700 dark:bg-neutral-800"
            >
                <div class="mx-auto flex w-full max-w-3xl items-center pb-3 pt-3">
                    <h1 class="min-w-0 truncate text-4xl font-bold">
                        {{ songbook.name }}
                    </h1>
                </div>
            </div>
            <!-- Sección inferior -->
            <div class="bg-card flex-1">
                @if (songsList(); as songs) {
                    <div
                        [cdkDropListDisabled]="!songbook.isReorderable"
                        cdkDropList
                        [cdkDropListData]="songs"
                        (cdkDropListDropped)="onDrop($event)"
                        class="w-full space-y-0 overflow-hidden"
                    >
                        @for (song of songs; track trackByFn($index, song)) {
                            <div class="w-full">
                                <chp-song-item
                                    [song]="song"
                                    (click)="selectSong(song)"
                                    (dblclick)="onDblClick(song)"
                                    class="w-full min-w-0 flex-1"
                                    [selected]="selectedSong()?.uid === song.uid"
                                    [showDragHandle]="songbook.isReorderable"
                                >
                                </chp-song-item>
                            </div>
                        }
                    </div>
                }
            </div>
        </div>
    }
</ng-template>

<ng-template #viewer>
    @if (selectedSong(); as song) {
        <chp-viewer [content]="song.content" isPreview="true"> </chp-viewer>
    }
</ng-template>
