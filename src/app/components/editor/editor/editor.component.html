<chp-editor-toolbar
    [mode]="mode"
    [showDelete]="showDelete"
    [songKey]="songKey"
    (saveSongEvent)="onSave()"
    (removeSongEvent)="onRemove()"
    (openFullEditorEvent)="onOpenFullEditor()"
    (previewEvent)="onPreview()"
    (transposeEvent)="onTranspose($event)"
    (closeEvent)="onClose()"
    (helpEvent)="onHelp()"
></chp-editor-toolbar>
<div id="chordProjectEditor" class="mt-4" #editorDiv tabindex="0"></div>
