<div
    #viewerContent
    [class.fixed]="isFullScreen"
    [class.inset-0]="isFullScreen"
    [class.z-40]="isFullScreen"
    [class.overflow-auto]="isFullScreen"
    [class.pt-16]="isFullScreen && deviceType !== 'phone'"
    [class.pb-24]="isFullScreen && deviceType === 'phone'"
    [class.show-columns]="isPreview ? false : viewSettings?.showColumns"
    [class.lyrics-font-style-italic]="viewSettings?.lyricsFontStyle?.isItalic"
    [class.chords-font-style-italic]="viewSettings?.chordsFontStyle?.isItalic"
    [class.comments-font-style-italic]="
        viewSettings?.commentsFontStyle?.isItalic
    "
    [class.lyrics-font-weight-bold]="viewSettings?.lyricsFontStyle?.isBold"
    [class.chords-font-weight-bold]="viewSettings?.chordsFontStyle?.isBold"
    [class.comments-font-weight-bold]="viewSettings?.commentsFontStyle?.isBold"
    [class]="
        'lyrics-font-size-' +
        viewSettings?.lyricsFontStyle?.size +
        ' ' +
        'chords-font-size-' +
        viewSettings?.chordsFontStyle?.size +
        ' ' +
        'comments-font-size-' +
        viewSettings?.commentsFontStyle?.size +
        ' ' +
        'lyrics-color-' +
        viewSettings?.lyricsFontStyle?.color +
        ' ' +
        'chords-color-' +
        viewSettings?.chordsFontStyle?.color +
        ' ' +
        'comments-color-' +
        viewSettings?.commentsFontStyle?.color
    "
    class="flex h-full flex-col bg-white dark:bg-neutral-900"
    [class.compact-preview]="compactPreview"
    style="background-color: light-dark(var(--color-white), var(--color-neutral-900))"
>
    @if (isFullScreen) {
        <!-- The toolbar lives outside this element, which native Fullscreen API hides; offer an exit control from within. -->
        <div class="fixed right-4 top-4 z-50 flex items-center rounded-full border border-neutral-200/80 bg-white/90 px-1.5 py-1 shadow-md backdrop-blur dark:border-neutral-800/80 dark:bg-neutral-900/90">
            <chp-fullscreen-tool [isFullScreen]="isFullScreen" (fullScreenEvent)="toggleFullScreen()"></chp-fullscreen-tool>
        </div>
    }
    @if (!isLoading) {
        <div
            [innerHtml]="songHtml | safeHtml"
            [style.font-size.%]="fontSize"
            class="content flex-1 [&_.chorus-section]:bg-neutral-100 dark:[&_.chorus-section]:bg-neutral-800 [&_.chorus-section]:shadow-sm [&_.chorus-section]:ring-1 [&_.chorus-section]:ring-neutral-200/60 dark:[&_.chorus-section]:ring-neutral-700/60 [&_.lyrics]:text-neutral-900 dark:[&_.lyrics]:text-neutral-100"
        ></div>
        <div class="h-6"></div>
    }
</div>
